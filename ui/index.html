<!doctype html>
<html lang="en" data-page = "login">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/171ef83349.js"
      crossorigin="anonymous"
    ></script>
    <title>LOGIN</title>
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <main class="main">
      <div class="container">
        <form action="#" method="#" class="form" novalid>
          <h1 class="form__title">T<i class="fa-regular fa-hand-pointer"></i>p into LUXURY</h1>
          <p class="form__subtitle">Hey there, enter your details to log in to your account</p>
          <input type="email" name="email" id="e-mail" placeholder="Enter email address" required/>
          <input type="password" name="password" id="password" placeholder="password" required/>
          <p class="recover-password"><a href="./public/recover.html">forgot password?</a></p>
          <button type="submit" class="submit-btn">Submit</button>
        </form>
        <div class="alt">
          <p class="alt__title">― Or Sign in with ―</p>
          <div class="alt__group">
              <button type="button" class="alt__btn" id="google"><i class="fa-brands fa-google"></i>Google</button>
              <button type="button" class="alt__btn" id="apple"><i class="fa-brands fa-apple"></i>Apple</button>
              <button type="button" class="alt__btn" id="facebook"><i class="fa-brands fa-facebook"></i>Facebook</button>
          </div>
        </div>
        <p class="account">
          Don't have an account?<a href="./public/register.html">Sign Up</a>
        </p>
      </div>
    </main>
    <script src="../js/script.js"></script>
  </body>
</html>
